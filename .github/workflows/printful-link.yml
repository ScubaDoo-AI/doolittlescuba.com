name: Printful link
# Links Printful's imported Shopify products to their blanks and print files (tools/printful_link.py).
# Leave "apply" off first: the dry run only lists what would be linked.
on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Lines to link'
        type: choice
        options: [offworld, organic, beanie, 'caps,beanie', caps, aquatic, signature, certifiedish, n73, stickers, 'signature,caps', 'stickers,offworld,n73,aquatic,signature,certifiedish,caps,beanie']
        default: aquatic
      apply:
        description: 'Apply (write the links). Off = dry run'
        type: boolean
        default: false
      force:
        description: 'Re-send files to variants already linked (after a print-file change)'
        type: boolean
        default: false
      show:
        description: 'Print the files and positions Printful stores for each matched variant'
        type: boolean
        default: false
      sku:
        description: 'Only SKUs starting with these prefixes, comma-separated (e.g. DS-NAV). Blank = all'
        type: string
        default: ''
permissions:
  contents: read
concurrency: printful
jobs:
  link:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install pillow numpy scipy scikit-image
      - name: Link
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          LINES: ${{ inputs.lines }}
          APPLY: ${{ inputs.apply }}
          FORCE: ${{ inputs.force }}
          SKU: ${{ inputs.sku }}
          SHOW: ${{ inputs.show }}
        run: |
          set -o pipefail
          if [ "$APPLY" = "true" ]; then FLAG=--apply; else FLAG=; fi
          if [ "$FORCE" = "true" ]; then FLAG="$FLAG --force"; fi
          if [ "$SHOW" = "true" ]; then FLAG="$FLAG --show"; fi
          if [ -n "$SKU" ]; then [[ "$SKU" =~ ^[A-Za-z0-9,_-]+$ ]] || { echo "::error::sku prefixes: letters, digits, - _ , only"; exit 1; }; FLAG="$FLAG --sku $SKU"; fi
          echo "mode: lines=$LINES apply=$APPLY force=$FORCE sku=$SKU show=$SHOW" | tee link.log
          python tools/printful_link.py --only "$LINES" $FLAG | tee -a link.log
          { echo '## Printful link'; echo; echo '```'; head -n 1 link.log; echo; tail -n 25 link.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
