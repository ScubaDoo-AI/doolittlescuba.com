# Daily: refresh js/catalog.json (what the site cart can sell: variants, sizes, prices, sold-out) from the shop,
# re-stamp the product cards, re-hash, and commit if anything changed. Uses only the public Storefront token.
name: catalog-map
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: catalog-map
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Refresh catalog and card links
        run: |
          python tools/catalog_map.py
          python tools/bust.py
      - name: Commit if changed
        run: |
          git config user.name 'catalog-map'
          git config user.email 'actions@users.noreply.github.com'
          git add -A js/catalog.json '*.html' '*/index.html' 'sites/*/index.html'
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m 'catalog-map: daily refresh of the site cart catalog'
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
