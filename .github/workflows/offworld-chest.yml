name: Off-World chest masters
# Also runs tools/chest_lower.py (what = chest-lower): Signature + Certified-ish left-chest fronts moved to top 2 in.
# Puts each Off-World chest mark on a full 12 x 16 in front master at the wearer's left chest (left 8 in, top 2 in)
# and uploads the 60 files to Shopify Files (tools/offworld_chest_fullarea.py). Leave "upload" off first: the run
# only renders and checks the geometry, and keeps the PNGs as an artifact to look at.
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'Which masters'
        type: choice
        options: [offworld, chest-lower]
        default: offworld
      upload:
        description: 'Upload to Shopify Files. Off = render + check only'
        type: boolean
        default: false
      only:
        description: 'offworld: designs like OW03 · chest-lower: signature or certifiedish. Blank = all'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  masters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install pillow numpy scipy scikit-image
      - name: Render (and upload)
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          UPLOAD: ${{ inputs.upload }}
          ONLY: ${{ inputs.only }}
          WHAT: ${{ inputs.what }}
        run: |
          set -o pipefail
          FLAG=
          if [ "$UPLOAD" = "true" ]; then FLAG=--upload; fi
          if [ -n "$ONLY" ]; then [[ "$ONLY" =~ ^[A-Za-z0-9,]+$ ]] || { echo "::error::only: codes like OW03 or lines like signature"; exit 1; }; FLAG="$FLAG --only $ONLY"; fi
          echo "mode: what=$WHAT upload=$UPLOAD only=$ONLY" | tee run.log
          if [ "$WHAT" = "chest-lower" ]; then SCRIPT=tools/chest_lower.py; else SCRIPT=tools/offworld_chest_fullarea.py; fi
          python $SCRIPT --out offworld-front $FLAG | tee -a run.log
          { echo "## Chest masters ($WHAT)"; echo; echo '```'; tail -n 30 run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: offworld-front-masters
          path: offworld-front/
          retention-days: 14
